name: CI

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install --upgrade "uv>=0.5"

      - name: Install project (with dev extras)
        run: uv pip install --system -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check src tests

      - name: Ruff (format check)
        run: ruff format --check src tests

      - name: Mypy
        run: mypy src

      - name: Pytest
        run: pytest

      # HARD REQUIREMENT: every concrete feature module in
      # src/trade/features/definitions/ must have at least one test that
      # calls assert_feature_contract (single-symbol) or
      # assert_multi_symbol_feature_contract (cross-asset). The check is
      # deliberately simple — if a feature has NO test file matching its
      # module name, the check fails; if the test exists but lacks the
      # contract call, it also fails.
      - name: Feature contract discipline
        run: |
          set -euo pipefail
          missing=()
          for f in src/trade/features/definitions/*.py; do
            base="$(basename "$f" .py)"
            if [ "$base" = "__init__" ]; then continue; fi
            test_file="tests/test_features_${base}.py"
            if [ ! -f "$test_file" ]; then
              missing+=("$test_file (no test file for feature '$base')")
              continue
            fi
            if ! grep -qE "assert_feature_contract|assert_multi_symbol_feature_contract" "$test_file"; then
              missing+=("$test_file (test file exists but does not call assert_feature_contract or assert_multi_symbol_feature_contract)")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "Feature contract check failed:" >&2
            printf '  - %s\n' "${missing[@]}" >&2
            exit 1
          fi
          echo "All feature modules have contract tests."
