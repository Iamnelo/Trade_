name: Validate offline 12H candles

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-12h-validation
  cancel-in-progress: false

jobs:
  resample-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resample committed hourly data and validate
        run: |
          python scripts/resample_hourly_to_12h.py \
            --output-dir offline-12h \
            --report offline-12h/validation-report.json

      - name: Add report to workflow summary
        if: always()
        run: |
          {
            echo "## Offline 12H data validation"
            echo
            echo "This run uses the committed hourly CSVs. It does not contain native 720 data."
            echo
            echo '~~~json'
            if [ -f offline-12h/validation-report.json ]; then
              cat offline-12h/validation-report.json
            else
              echo '{"passed": false, "error": "validation report was not produced"}'
            fi
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload resampled data and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-12h-validation
          path: offline-12h/
          if-no-files-found: warn
          retention-days: 7
