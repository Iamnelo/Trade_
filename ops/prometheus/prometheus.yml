global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Local trade-platform metrics endpoint. On Docker Desktop / Docker Engine
  # with host.docker.internal available, this reaches the host process
  # exposing prometheus_client on TRADE_PROMETHEUS_PORT (default 9464).
  - job_name: trade
    static_configs:
      - targets: ["host.docker.internal:9464"]
