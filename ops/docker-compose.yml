# Local developer stack. NOT production-grade.
# Bring up with: `make dev-up`. Data is persisted in named volumes.
#
# Ports (host-side):
#   9000  QuestDB web console + REST
#   8812  QuestDB PostgreSQL wire protocol
#   9009  QuestDB InfluxDB line protocol ingest
#   6379  Redis
#   9002  MinIO S3 API
#   9003  MinIO console (login: minioadmin / minioadmin)
#   9090  Prometheus
#   3000  Grafana (login: admin / admin)
#   3100  Loki

services:
  questdb:
    image: questdb/questdb:8.1.4
    container_name: trade-questdb
    ports:
      - "9000:9000"
      - "8812:8812"
      - "9009:9009"
    volumes:
      - questdb-data:/var/lib/questdb
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: trade-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: trade-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: trade-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    container_name: trade-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

  loki:
    image: grafana/loki:3.3.2
    container_name: trade-loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"
    restart: unless-stopped

volumes:
  questdb-data:
  minio-data:
  redis-data:
  prometheus-data:
  grafana-data:
