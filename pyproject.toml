[project]
name = "trade"
version = "0.1.0"
description = "AI-powered quantitative trading platform for Bybit USDT perpetuals (V1 signal service)."
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Trade Platform" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "httpx>=0.27",
    "orjson>=3.10",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trade"]

# ---------------------------------------------------------------------------
# Ruff — lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]
extend-exclude = ["scripts/_scratch"]

[tool.ruff.lint]
select = [
    "E", "F", "W",     # pyflakes / pycodestyle
    "I",               # isort
    "N",               # pep8-naming
    "UP",              # pyupgrade
    "B",               # bugbear
    "SIM",             # simplify
    "C4",              # comprehensions
    "A",               # builtins
    "RET",             # returns
    "PL",              # pylint
    "RUF",             # ruff-specific
    "TID",             # tidy imports
]
ignore = [
    "PLR0913",  # too many arguments — trading APIs need them
    "PLR2004",  # magic value comparison — readable inline literals are fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004", "S101"]

# ---------------------------------------------------------------------------
# Mypy — strict, with narrow overrides where third-party typing is loose
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["trade"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = "trade.logging_setup"
disallow_untyped_calls = false
warn_return_any = false

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=trade --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pydantic.*",
]

[tool.coverage.run]
branch = true
source = ["trade"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
