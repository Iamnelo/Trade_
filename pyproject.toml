[project]
name = "trade"
version = "0.1.0"
description = "AI-powered quantitative trading platform for Bybit USDT perpetuals (V1 signal service)."
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Trade Platform" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "httpx>=0.27",
    "orjson>=3.10",
    "prometheus-client>=0.20",
    "polars>=1.0",
    "pyarrow>=16.0",
    "boto3>=1.34",
    "typer>=0.12",
    "tenacity>=8.3",
    "websockets>=13.0",
    "psycopg[binary]>=3.2",
    "mlflow-skinny>=2.16",
    "duckdb>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trade"]

# ---------------------------------------------------------------------------
# Ruff — lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]
extend-exclude = ["scripts/_scratch"]

[tool.ruff.lint]
select = [
    "E", "F", "W",     # pyflakes / pycodestyle
    "I",               # isort
    "N",               # pep8-naming
    "UP",              # pyupgrade
    "B",               # bugbear
    "SIM",             # simplify
    "C4",              # comprehensions
    "A",               # builtins
    "RET",             # returns
    "PL",              # pylint
    "RUF",             # ruff-specific
    "TID",             # tidy imports
]
ignore = [
    "PLR0913",  # too many arguments — trading APIs need them
    "PLR2004",  # magic value comparison — readable inline literals are fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004", "S101"]
# Typer's declarative style relies on function-call defaults (typer.Option)
# and many keyword-style parameters — both are correct for its API surface.
"src/trade/cli/**/*.py" = ["B008", "PLR0913", "PLR0917"]

# ---------------------------------------------------------------------------
# Mypy — strict, with narrow overrides where third-party typing is loose
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["trade"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = "trade.logging_setup"
disallow_untyped_calls = false
warn_return_any = false

# boto3 does not ship typing information. Rather than pin type stubs (which lag
# releases), treat it as untyped here — S3Store wraps a small surface and its
# tests assert the behaviour.
[[tool.mypy.overrides]]
module = ["boto3", "botocore", "botocore.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=trade --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pydantic.*",
    "ignore::DeprecationWarning:botocore.*",
    "ignore::DeprecationWarning:polars.*",
]

[tool.coverage.run]
branch = true
source = ["trade"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
